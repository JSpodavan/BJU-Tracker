<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Добро пожаловать</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="index.js"></script>
    </head>
    <body>
        <div class="welcome-container">
            <header class="welcome-header">
                <h1>Добро пожаловать!</h1>
                <p>Присоединяйтесь к нашему сообществу</p>
            </header>

            <!-- Форма регистрации (изначально видима) -->
            <div class="form-container" id="registerFormContainer">
                <h2>Регистрация</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <input
                            type="text"
                            id="username"
                            placeholder="Имя пользователя"
                            required
                        />
                    </div>
                    <div class="form-group">
                        <input
                            type="email"
                            id="email"
                            placeholder="Электронная почта"
                            required
                        />
                    </div>
                    <div class="form-group">
                        <input
                            type="password"
                            id="password"
                            placeholder="Пароль"
                            required
                        />
                    </div>
                    <div class="form-group">
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Подтвердите пароль"
                            required
                        />
                    </div>
                    <button type="submit" class="submit-btn">
                        Зарегистрироваться
                    </button>
                </form>

                <div class="switch-form">
                    <p>
                        Уже зарегистрированы?
                        <a href="#" id="showLoginBtn">Войти</a>
                    </p>
                </div>
            </div>

            <!-- Форма входа (изначально скрыта) -->
            <div
                class="form-container"
                id="loginFormContainer"
                style="display: none"
            >
                <h2>Вход</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Электронная почта"
                            required
                        />
                    </div>
                    <div class="form-group">
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Пароль"
                            required
                        />
                    </div>
                    <button type="submit" class="submit-btn">Войти</button>
                </form>

                <div class="switch-form">
                    <p>
                        Ещё не зарегистрированы?
                        <a href="#" id="showRegisterBtn">Создать аккаунт</a>
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
