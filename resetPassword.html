<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Сброс пароля</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="reset-container">
            <h1>Сброс пароля</h1>
            <p class="description">
                Введите новый пароль для вашего аккаунта. Пароль должен
                содержать не менее 8 символов.
            </p>

            <form id="resetForm">
                <input type="hidden" id="resetToken" />

                <div class="form-group">
                    <label for="newPassword">Новый пароль</label>
                    <input type="password" id="newPassword" required />
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="requirements">
                        <div class="requirement" id="lengthReq">
                            <i class="fas fa-check"></i> Не менее 8 символов
                        </div>
                        <div class="requirement" id="numberReq">
                            <i class="fas fa-check"></i> Содержит цифру
                        </div>
                        <div class="requirement" id="specialReq">
                            <i class="fas fa-check"></i> Специальный символ
                            (!@#$%^&*)
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Подтвердите пароль</label>
                    <input type="password" id="confirmPassword" required />
                </div>

                <button type="submit" id="submitBtn">Сохранить пароль</button>
            </form>

            <div class="message" id="message"></div>
        </div>

        <script src="resetPassword.js"></script>
    </body>
</html>
